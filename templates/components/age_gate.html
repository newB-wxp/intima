<div id="age-gate" class="age-gate">
  <div class="age-gate__card">
    <p class="age-gate__pretitle">Before We Begin</p>
    <h2 class="age-gate__title">Are you over 18 years of age?</h2>
    <p class="age-gate__subtitle">This website contains products intended for adults only.</p>
    <div class="age-gate__actions">
      <button class="age-gate__yes">YES, I'm 18 or older</button>
      <button class="age-gate__no">NO, I'm under 18</button>
    </div>
    <p class="age-gate__footer">By clicking YES you confirm you are of legal age in your jurisdiction.</p>
  </div>
</div>
