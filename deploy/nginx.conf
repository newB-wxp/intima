# ============================================================
# Bibi Project - Nginx Configuration
# Render 部署无需使用 — Render 自动处理 SSL 和反向代理。
# 本文件仅供裸机 / VPS 自部署参考。
# ============================================================
# Place this file at: /etc/nginx/sites-available/bibi
# Then: ln -s /etc/nginx/sites-available/bibi /etc/nginx/sites-enabled/
# Test:  nginx -t
# Reload: systemctl reload nginx
# ============================================================

# --- HTTP (Port 80) ---
server {
    listen 80;
    listen [::]:80;
    server_name bibi.shop www.bibi.shop;

    # Redirect all HTTP to HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    # Static files - served directly by Nginx
    location /static/ {
        alias /opt/bibi/application/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        gzip_types text/css application/javascript image/svg+xml;
    }

    # Proxy to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Health check endpoint (no logging to keep access log clean)
    location /api/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    # Client max body size (16MB for uploads)
    client_max_body_size 16M;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

