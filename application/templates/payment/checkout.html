<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout — Bibi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #0f0f13; color: #e8e8ea; min-height: 100vh; display: flex;
               align-items: center; justify-content: center; padding: 20px; }
        .checkout-card { background: #1a1a20; border-radius: 16px; padding: 40px;
                         max-width: 480px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
        .brand { text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #9a9aa5; margin-bottom: 32px; font-size: 14px; }
        .order-summary { background: #23232b; border-radius: 12px; padding: 20px; margin-bottom: 28px; }
        .order-summary h3 { font-size: 14px; color: #9a9aa5; margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px; }
        .summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; }
        .summary-row.total { border-top: 1px solid #34343f; margin-top: 8px; padding-top: 14px; font-weight: 700; font-size: 18px; }
        .pay-btn { width: 100%; background: linear-gradient(135deg, #ff2d78, #ff6a3d);
                   color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 16px;
                   font-weight: 600; cursor: pointer; transition: transform .15s; }
        .pay-btn:hover { transform: translateY(-2px); }
        .pay-btn:disabled { opacity: .6; cursor: not-allowed; }
        .secure-note { text-align: center; color: #6a6a75; font-size: 12px; margin-top: 20px; }
        .error-msg { color: #ff5a5a; font-size: 14px; text-align: center; margin-top: 16px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="checkout-card">
        <div class="brand">Bibi</div>
        <div class="subtitle">Secure Adult Checkout</div>

        <div class="order-summary">
            <h3>Order Summary</h3>
            <div class="summary-row">
                <span>Order #</span>
                <span>{{ order.short_id }}</span>
            </div>
            <div class="summary-row">
                <span>Items ({{ order.entries|length }})</span>
                <span>${{ '%.2f'|format(order.amount) }}</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span>${{ '%.2f'|format(order.cn_shipping) }}</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span>${{ '%.2f'|format(order.final) }}</span>
            </div>
        </div>

        <button class="pay-btn" id="payBtn" onclick="processPayment()">
            Pay with Card
        </button>

        <div class="error-msg" id="errorMsg"></div>

        <div class="secure-note">
            256-bit SSL encrypted · Your payment is processed securely
        </div>
    </div>

    <script>
        function processPayment() {
            const btn = document.getElementById('payBtn');
            const err = document.getElementById('errorMsg');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            err.textContent = '';

            fetch('/api/payment/checkout/{{ order.id }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ payment_method: 'card' })
            })
            .then(r => r.json())
            .then(data => {
                if (data.message === 'OK' && data.url) {
                    window.location.href = data.url;
                } else {
                    err.textContent = data.error || 'Payment failed. Please try again.';
                    btn.disabled = false;
                    btn.textContent = 'Pay with Card';
                }
            })
            .catch(() => {
                err.textContent = 'Network error. Please try again.';
                btn.disabled = false;
                btn.textContent = 'Pay with Card';
            });
        }
    </script>
</body>
</html>
