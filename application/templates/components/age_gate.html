{# components/age_gate.html - Age Gate Overlay #}
<div class="age-gate" id="age-gate">
  <div class="age-gate-content">
    <div class="age-gate-logo">Intima</div>
    <h2 class="age-gate-title">Are you over 18?</h2>
    <p class="age-gate-desc">
      This site contains products intended for adults only. By entering, you confirm that you are at least 18 years of age.
    </p>
    <div class="age-gate-buttons">
      <button class="btn btn-primary age-gate-yes" type="button">Yes, I'm 18+</button>
      <button class="btn btn-outline age-gate-no" type="button">No, I'm under 18</button>
    </div>
  </div>
</div>
