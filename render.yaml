# Render Blueprint — Bibi Adult Independent Station
# https://render.com/docs/blueprint-spec

services:
  # =============================================
  # Web Service: Flask + Gunicorn
  # =============================================
  - type: web
    name: bibi-web
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 3 --max-requests 1000 --timeout 60 -b 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: IDCARD_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: bibi-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: bibi-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bibi-redis
          property: connectionString
      - key: CCBILL_ACCOUNT_ID
        sync: false
      - key: CCBILL_API_KEY
        sync: false
      - key: ECOMCHARGE_API_KEY
        sync: false
      - key: WCPAY_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: OAUTH_REDIRECT_BASE
        sync: false
      - key: PAYMENT_SANDBOX
        value: "true"
      - key: TALISMAN_ENABLED
        value: "true"
      - key: DEV_MODE
        value: "false"

  # =============================================
  # Redis: Session storage & Celery broker
  # =============================================
  - type: redis
    name: bibi-redis
    plan: free
    ipAllowList: []

  # =============================================
  # Worker Service: Celery Worker
  # =============================================
  - type: worker
    name: bibi-worker
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A application.cel worker --loglevel=info --concurrency=2
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: IDCARD_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: bibi-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: bibi-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bibi-redis
          property: connectionString
      - key: DEV_MODE
        value: "false"
